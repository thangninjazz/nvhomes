name: Deploy NVHome to VPS (v2.24.1)
# Triggering fresh build after VPS Docker upgrade

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/nvhome
            git pull origin main
            DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 sudo docker-compose up -d --build
