services:
  db:
    image: postgres:15-alpine
    container_name: nvhome_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nvhomedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nvhome_net
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nvhome_backend
    ports:
      - "127.0.0.1:5232:5232"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=nvhomedb;Username=postgres;Password=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    depends_on:
      - db
    networks:
      - nvhome_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://nvhomes.vn/api
    container_name: nvhome_frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://nvhomes.vn/api
    depends_on:
      - backend
    networks:
      - nvhome_net
    restart: unless-stopped

networks:
  nvhome_net:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
