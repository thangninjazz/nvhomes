version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nvhome_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: nvhomedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nvhome_net
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nvhome_backend
    ports:
      - "5232:5232"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=nvhomedb;Username=postgres;Password=${DB_PASSWORD:-password}
    depends_on:
      - db
    networks:
      - nvhome_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nvhome_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://nvhomes.vn/api
    depends_on:
      - backend
    networks:
      - nvhome_net
    restart: unless-stopped

networks:
  nvhome_net:
    driver: bridge

volumes:
  postgres_data:
